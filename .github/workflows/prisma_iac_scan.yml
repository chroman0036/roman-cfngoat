name: Prisma Cloud IaC Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  prisma_cloud_iac_scan:
    runs-on: ubuntu-latest
    name: Run Prisma Cloud IaC Scan to check Compliance
    steps: 
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Set up Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch --tags
          git pull

      - name: Determine Latest Tag
        id: get_latest_tag
        run: |
          latest_tag=$(git describe --tags `git rev-list --tags --max-count=1` 2>/dev/null || echo "0.0.0")
          echo "latest tag: $latest_tag"
          echo "::set-output name=latest_tag::$latest_tag"

      - name: Calculate New Tag
        id: calc_new_tag
        run: |
          latest_tag=${{ steps.get_latest_tag.outputs.latest_tag }}
          new_tag=$(echo $latest_tag | awk -F. -v a="0" -v b="0" -v c="1" '{printf("%d.%d.%d", $1+a, $2+b, $3+c)}')
          echo "new tag: $new_tag"
          echo "::set-output name=new_tag::$new_tag"

      - name: Install Checkov
        run: pip install -U checkov

      - name: Run Checkov Scan and Update README
        run: |
          cat .github/template.md > README.md && checkov -d . -o github_failed_only -s >> README.md
          git add README.md
          git commit -m "update resource scan result doc" README.md || echo "No changes to commit"
          git push origin

      - name: Create and Push New Tag
        run: |
          new_tag=${{ steps.calc_new_tag.outputs.new_tag }}
          git tag $new_tag
          git push origin $new_tag

      - name: Run Scan on IaC .tf files in the repository
        uses: bridgecrewio/checkov-action@master
        id: iac-scan
        env:
          PRISMA_API_URL: https://api.prismacloud.io
        with:
          api-key: ${{ secrets.BC_API_KEY }}
          directory: ./cfngoat.yaml
          framework: cft
          quiet: true
          use_enforcement_rules: true
